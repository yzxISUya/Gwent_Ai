[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gwent-rl"
version = "1.1.0"
description = "Reinforcement Learning (Masked PPO + PFSP League + SO-IS-MCTS + Zero-Sum Spectator Net) for The Witcher 3 Gwent"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "gymnasium>=0.29.0",
    "onnx>=1.16.0",
    "onnxscript>=0.1.0",
    "onnxruntime>=1.18.0",
    "matplotlib>=3.8.0",
]

[tool.setuptools.packages.find]
include = ["gwent_rl*"]
